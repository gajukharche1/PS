services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ps-web:latest
    container_name: ps-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pimplesaudagar_dev?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - APP_SECRET=development_secret_must_be_at_least_32_characters_long_ps_dir
      - CRON_SECRET=dev_cron_secret_key_12345
      - NEXT_PUBLIC_STORAGE_PUBLIC_URL=http://localhost:9000/pimple-saudagar-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ps-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pimplesaudagar_dev
    ports:
      - "5432:5432"
    volumes:
      - ps-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pimplesaudagar_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ps-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ps-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ps-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ps-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  ps-postgres-data:
  ps-redis-data:
  ps-minio-data:
