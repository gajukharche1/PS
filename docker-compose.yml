services:
  postgres:
    image: postgres:16-alpine
    container_name: ps-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pimplesaudagar_dev
    ports:
      - "5432:5432"
    volumes:
      - ps-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pimplesaudagar_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ps-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ps-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ps-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ps-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  ps-postgres-data:
  ps-redis-data:
  ps-minio-data:
